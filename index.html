function list(){
  const q=S.q.trim().toLowerCase(),now=new Date(),t0=d0(now);
  return S.ev.filter(e=>e.status==="approved"&&endOf(e)>=now).filter(e=>{
    const ds=daysOf(e).map(d=>[d,Math.round((d-t0)/864e5)]);
    if(S.favOnly&&!hasE(S.efavs,e.id))return false;
    if(S.city.size&&!S.city.has(e.city))return false;
    if(S.age.size&&![...S.age].some(a=>e.age_min<=+a&&+a<=e.age_max))return false;
    if(S.fee.size&&![...S.fee].some(f=>f==="free"?e.fee===0:f==="paid"?e.fee>0:e.fee<=+f))return false;
    if(S.org.size&&!S.org.has(e.profiles?.account_type))return false;
    if(S.aud.size&&!S.aud.has(e.audience))return false;
    if(S.tod.size){const rs=todRs(e);if(![...S.tod].some(t=>t==="all"?(e.flex_time||rs.some(([a,b])=>b-a>=8)):rs.some(([a,b])=>a<TOD[t][1]&&b>TOD[t][0])))return false}
    if(q&&!(e.title+e.description+(e.venue||"")+(e.district||"")+e.city).toLowerCase().includes(q))return false;
    if(S.when.size&&![...S.when].some(w=>w==="today"?ds.some(x=>x[1]===0):w==="weekend"?ds.some(x=>[0,6].includes(x[0].getDay())&&x[1]>=0&&x[1]<=6):w==="7d"?ds.some(x=>x[1]>=0&&x[1]<=7):ds.some(x=>x[0].getMonth()===now.getMonth()&&x[0].getFullYear()===now.getFullYear())))return false;
    return true;
  }).sort((a,b)=>new Date(a.start_at)-new Date(b.start_at));
}

<h3>三、投稿規則</h3><ul><li>本站僅供非商業分享：禁止廣告、推銷、團購、導購連結與業配。</li><li>可以提到遊戲或桌遊的名稱，但請以玩法為主，不附購買連結、不推薦店家。</li><li>內容須為原創或親身玩過，並適合孩子的年齡；桌遊等有版權的規則請用自己的話改寫。</li><li>照片與內容請遵守隱私及著作權（詳見「著作權與下架申請」）。</li><li>相關連結同樣需通過審核。</li></ul>
<h3>四、審核與管理</h3><p>審核只檢查內容是否符合投稿規則，不代表本站已驗證內容的正確性、安全性或效果。本站得在不事先通知的情況下退回、下架或刪除內容，並對違規帳號停權。停權後，該帳號無法投稿、留言或互動，其公開的遊戲與留言會被隱藏。</p>
<h3>五、安全與免責聲明</h3><ul><li>所有遊戲都應在大人陪同下進行。請家長依孩子的年齡、能力、過敏與環境自行評估，特別留意小零件造成的噎到風險。</li><li>本站內容僅為家長分享的經驗，不是醫療、教育或心理專業建議，也不保證任何成效。</li><li>在法律允許的範圍內，本站與管理者不對因參考或使用本站內容所產生的損害負責。</li></ul>
<h3>六、外部連結</h3><p>使用者提供的外部連結內容不屬於本站，本站不對其內容與安全負責，請自行留意。</p>
<h3>七、服務變更</h3><p>本站可能因維護或其他原因暫時中斷、修改或終止服務。</p>
<h3>八、親子活動資訊</h3><ul><li>活動資訊由主辦方（個人、商家或機構）提供，本站只做資訊公布，不代收報名與費用，也不是活動的主辦方、合作方或保證方。</li><li>「商家／機構」身分由註冊者自行選擇，本站不驗證其真實性。</li><li>活動日期、地點、費用與內容可能變更或取消，請以主辦方公告為準，參加前請自行確認並評估孩子的安全。</li><li>請不要在網站外先付款給不熟悉的對象；發現可疑活動請使用檢舉功能。</li><li>活動區僅限分享資訊，禁止促銷折扣、團購、業配與集客文字；商家與機構帳號不能在遊戲區投稿或留言。</li></ul>
<h3>九、聯絡</h3><p>${MAIL}</p>`],
copyright:["著作權與下架申請",`<h3>投稿者的聲明</h3><ul><li>你投稿的文字、照片與連結須為你自己創作，或已取得合法授權。</li><li>桌遊、書籍、教材等的規則與內容，請用自己的話改寫，不要整段複製；不要使用他人的圖片或作品。</li><li>照片中若有他人的肖像，須取得對方同意。</li></ul>

<h3>認為內容侵害你的權利？</h3><p>請寄信到 ${MAIL}，並附上：</p><ul><li>你的姓名與聯絡方式</li><li>你擁有的權利說明</li><li>被指侵權內容所在的頁面網址</li><li>說明為什麼該內容侵害你的權利</li><li>聲明你提供的資訊屬實</li></ul><p>我們會盡快審查，必要時會先暫時下架並通知投稿者。重複侵權的帳號將被停權。你也可以直接使用每個遊戲頁面上的「檢舉」按鈕。</p>`]

function doc(k){const[t,h]=DOCS[k];$("#app").innerHTML=`<p><a data-go="#/">← 返回</a></p><div class="doc"><h2>${t}</h2>${h}<p class="mu">最後更新：2026 年 10 月 25 日</p></div>`}

function homePage(){
  $("#app").innerHTML=`<div class="intro"><h2>今天想找什麼？</h2><p>找靈感、找活動，也把生活中的好點子分享出去。</p></div>
<div class="choose">
<a class="pick a" href="#/events"><div class="eyebrow">EVENTS</div><h2>找親子活動</h2><p>查看近期活動日曆，依地點、孩子年齡、費用與時間篩選。</p><span class="go">看活動日曆 →</span></a>
<a class="pick b2" href="#/games"><div class="eyebrow">GAMES</div><h2>找遊戲</h2><p>在家就能玩的親子遊戲點子，依孩子年齡和現有材料來找。</p><span class="go">找遊戲點子 →</span></a>
</div>
<div class="share"><h3>一起分享，讓更多家庭找到好點子</h3><p>家長可以分享居家遊戲，店家與機構可以分享親子活動資訊。本站僅提供資訊分享，不代收報名與費用。</p><div class="share-actions"><a class="primary" href="#/share-event">分享活動</a><a href="#/share-game">分享遊戲</a></div></div>`;
}
const ACC={tab:"posts",open:{}},ADM={open:{}};
const secOf=(st,k,t,n,body)=>`<details class="sec" data-k="${k}" ${st[k]!==false?"open":""}><summary><h3>${t}（${n}）</h3></summary>${body}</details>`;
const hookSec=st=>document.querySelectorAll("#app details.sec").forEach(d=>{d.ontoggle=()=>{st[d.dataset.k]=d.open}});
async function accountPage(){
  if(!AUTH.u){$("#app").innerHTML='<div class="doc"><h2>我的帳號</h2><p>請先登入，才能查看你的投稿與收藏。</p><button class="p" data-a="auth">登入／註冊</button></div>';return}
  await Promise.all([G.ensure(),E.ensure()]);
  const uid=AUTH.u.id,gs=G.S,es=E.S,org=AUTH.me?.account_type==="organization",st={pending:"審核中",approved:"已發佈",rejected:"已退回"};
  const myG=gs.games.filter(g=>g.author_id===uid),myE=es.ev.filter(e=>e.author_id===uid);
  const fG=gs.games.filter(g=>g.status==="approved"&&gs.favs.some(f=>f.game_id===g.id&&f.user_id===uid));
  const fE=es.ev.filter(e=>e.status==="approved"&&es.efavs.some(f=>f.event_id===e.id&&f.user_id===uid));
  const sc=x=>x.status!=="approved"?` · <b>${st[x.status]}</b>${x.reject_reason?"："+esc(x.reject_reason):""}`:" · 已發佈";
  const gi=(g,mine)=>`<div class="cm"><a data-go="#/games/g/${g.id}"><b>${esc(g.title)}</b></a> <span class="mu">${G.AGES[g.age]}${mine?sc(g):""}</span><div class="r">${mine?`<button data-a="g.edit" data-id="${g.id}">編輯</button><button class="d" data-a="g.delgame" data-id="${g.id}">刪除</button>`:`<button data-a="g.toggle" data-t="favs" data-id="${g.id}">取消收藏</button>`}</div></div>`;
  const ei=(e,mine)=>`<div class="cm"><a data-go="#/events/e/${e.id}"><b>${esc(e.title)}</b></a> <span class="mu">${E.tRange(e)} · ${esc(e.city)}${mine?sc(e):""}</span><div class="r">${mine?`<button data-a="e.edit" data-id="${e.id}">編輯</button><button class="d" data-a="e.del" data-id="${e.id}">刪除</button>`:`<button data-a="e.toggle" data-t="event_favs" data-id="${e.id}">取消收藏</button>`}</div></div>`;
  const tb=(k,t)=>`<button data-a="a.tab" data-v="${k}" class="${ACC.tab===k?"on":""}">${t}</button>`;
  const none='<p class="mu">還沒有內容。</p>';
  const posts=`${org?"":secOf(ACC.open,"pg","遊戲",myG.length,myG.map(g=>gi(g,1)).join("")||none)}${secOf(ACC.open,"pe","活動",myE.length,myE.map(e=>ei(e,1)).join("")||none)}${org?'<p class="mu">商家／機構帳號只能發佈活動。</p>':""}`;
  const favs=`${secOf(ACC.open,"fg","遊戲",fG.length,fG.map(g=>gi(g,0)).join("")||none)}${secOf(ACC.open,"fe","活動",fE.length,fE.map(e=>ei(e,0)).join("")||none)}`;
  $("#app").innerHTML=`${AUTH.me?.suspended?`<p class="rule">你的帳號已被停權，無法投稿、留言或互動。如有疑問請來信 ${MAIL}。</p>`:""}
  <h2 style="margin:6px 8px 12px">我的帳號</h2>
  <div class="card-box"><p style="margin:0"><b>${esc(AUTH.me?.nickname||"")}</b> <span class="t ${org?"org":""}">${org?"商家／機構":"個人"}</span></p><p class="mu" style="margin:4px 0 0">${esc(AUTH.u.email||"")}</p>${org?`<div style="margin-top:12px"><label class="mu">商家／機構簡介（10–200 字，會顯示在你的主辦方頁面）<textarea id="pb" rows="3" maxlength="200">${esc(AUTH.me?.bio||"")}</textarea></label><label class="mu">官方網站（選填）<input id="pw" type="url" maxlength="200" placeholder="https://" value="${esc(AUTH.me?.website||"")}"></label><div class="r"><button data-a="a.savebio">儲存簡介</button><span class="mu" id="pbm"></span></div></div>`:""}<div class="r"><button class="p" data-a="e.new">＋ 分享活動</button>${org?"":'<button class="p" data-a="g.new">＋ 分享遊戲</button>'}</div></div>
  <div class="r" style="margin-top:16px">${tb("posts","我的投稿")}${tb("favs","我的收藏")}</div>
  ${ACC.tab==="posts"?posts:favs}
  <div class="card-box" style="margin-top:28px"><h3 style="margin:0 0 6px">帳號設定</h3><p class="mu" style="margin:0 0 10px">刪除帳號會一併刪除你的所有投稿、照片、留言與收藏，無法復原。</p><button class="d" data-a="a.delacc">刪除我的帳號</button></div>`;
  hookSec(ACC.open);
}
async function adminPage(){
  if(!AUTH.me?.is_admin){$("#app").innerHTML="<p>沒有權限。</p>";return}
  await Promise.all([G.load(),E.load()]);
  const gp=G.S.games.filter(g=>g.status==="pending"),ep=E.S.ev.filter(e=>e.status==="pending");
  const{data:rp}=await sb.from("reports").select("*,games!game_id(title),comments!comment_id(body,game_id),events!event_id(title),target:profiles!target_user_id(id,nickname,suspended)").order("created_at");
  const{data:sp}=await sb.from("profiles").select("id,nickname").eq("suspended",true);
  const{data:rb}=await sb.from("profiles").select("id,nickname,bio,website,bio_updated_at").not("bio_updated_at","is",null).gte("bio_updated_at",new Date(Date.now()-14*864e5).toISOString()).order("bio_updated_at",{ascending:false});
  const{AGES,REASONS:GR,nick:gn}=G,{REASONS:ER,nick:en,tRange,ageTxt,feeTxt,AUD,isOrg,orgTag}=E;
  const gItem=g=>`<div class="cm"><a data-go="#/games/g/${g.id}"><b>${esc(g.title)}</b></a> <span class="mu">${esc(gn(g))} · ${AGES[g.age]}</span><div class="r">${g.photos.map(x=>`<img src="${pub(x)}" alt="" width="90">`).join("")}</div><p>${esc(g.how)}</p>${g.link?`<p class="mu">連結：<a href="${esc(g.link)}" target="_blank" rel="noopener noreferrer nofollow">${esc(g.link)}</a></p>`:""}<div class="r"><button class="p" data-a="g.approve" data-id="${g.id}">核准</button>退回：${GR.map(r=>`<button class="d" data-a="g.reject" data-id="${g.id}" data-r="${r}">${r}</button>`).join("")}</div></div>`;
  const eItem=e=>`<div class="cm"><a data-go="#/events/e/${e.id}"><b>${esc(e.title)}</b></a> ${orgTag(e)} <span class="mu">${esc(en(e))} · ${tRange(e)} · ${esc(e.city)}${esc(e.district||"")} · ${ageTxt(e)} · ${feeTxt(e)}</span>${e.photo?`<div class="r"><img src="${pub(e.photo)}" alt="" width="120"></div>`:""}<p>${esc(e.description)}</p>${isOrg(e)&&e.profiles?.bio?`<p class="mu">主辦方簡介：${esc(e.profiles.bio)}${e.profiles.website?"｜"+esc(e.profiles.website):""}</p>`:""}<p class="mu">對象：${AUD[e.audience]||"親子"}${e.flex_time?"｜無特定時間／可自行預約":""}</p>${e.link?`<p class="mu">連結：<a href="${esc(e.link)}" target="_blank" rel="noopener noreferrer nofollow">${esc(e.link)}</a></p>`:""}${e.address?`<p class="mu">地址：${esc(e.address)}</p>`:""}${e.map_link?`<p class="mu">地圖連結：<a href="${esc(e.map_link)}" target="_blank" rel="noopener noreferrer nofollow">${esc(e.map_link)}</a></p>`:""}<div class="r"><button class="p" data-a="e.approve" data-id="${e.id}">核准</button>退回：${ER.map(r=>`<button class="d" data-a="e.reject" data-id="${e.id}" data-r="${r}">${r}</button>`).join("")}</div></div>`;
  const rItem=r=>`<div class="cm">${r.game_id?`<a data-go="#/games/g/${r.game_id}">遊戲：${esc(r.games?.title)}</a>`:r.comment_id?`留言：${esc(r.comments?.body)}${r.comments?.game_id?` <a data-go="#/games/g/${r.comments.game_id}">前往遊戲</a>`:""}`:r.event_id?`<a data-go="#/events/e/${r.event_id}">活動：${esc(r.events?.title)}</a>`:`作者／主辦方：${esc(r.target?.nickname)}${r.target?.suspended?"（已停權）":""} <a data-a="${r.target?.suspended?"x.unsus":"x.sus"}" data-id="${r.target_user_id}">${r.target?.suspended?"解除停權":"停權"}</a>`}<br>原因：${esc(r.reason)} <a data-a="x.delrep" data-id="${r.id}">忽略此檢舉</a></div>`;
  const bItem=u=>`<div class="cm"><a data-go="#/events/org/${u.id}"><b>${esc(u.nickname)}</b></a> <span class="mu">${new Date(u.bio_updated_at).toLocaleDateString("zh-TW")}</span><p style="margin:4px 0 0">${esc(u.bio)}${u.website?" ｜ "+esc(u.website):""}</p></div>`;
  $("#app").innerHTML=`<h2 style="margin:6px 8px 12px">審核</h2>${secOf(ADM.open,"ag","待審核遊戲",gp.length,gp.map(gItem).join("")||'<p class="mu">沒有待審核的遊戲。</p>')}${secOf(ADM.open,"ae","待審核活動",ep.length,ep.map(eItem).join("")||'<p class="mu">沒有待審核的活動。</p>')}${secOf(ADM.open,"ar","檢舉",rp?.length||0,(rp||[]).map(rItem).join("")||'<p class="mu">沒有檢舉。</p>')}${secOf(ADM.open,"ab","近期修改簡介的商家（14 天內）",rb?.length||0,(rb||[]).map(bItem).join("")||'<p class="mu">近 14 天沒有商家修改簡介。</p>')}${secOf(ADM.open,"as","停權名單",sp?.length||0,(sp||[]).map(u=>`<div class="cm">${esc(u.nickname)} <a data-a="x.unsus" data-id="${u.id}">解除停權</a></div>`).join("")||'<p class="mu">沒有停權的帳號。</p>')}`;
  hookSec(ADM.open);
}
ACT["a.savebio"]=async()=>{const m=$("#pbm");m.textContent="儲存中…";
  const{error}=await sb.rpc("update_my_profile",{p_bio:$("#pb").value,p_website:$("#pw").value});
  if(error){m.textContent="儲存失敗："+zh(error);return}
  const{data}=await sb.from("profiles").select("*").eq("id",AUTH.u.id).maybeSingle();AUTH.me=data;E.reset();m.textContent="已儲存，簡介已更新。";};
ACT["a.tab"]=el=>{ACC.tab=el.dataset.v;ROUTE(true)};
ACT["a.delacc"]=async()=>{
  if(prompt("刪除帳號會一併刪除你的所有投稿、照片、留言與收藏，無法復原。\n確定請輸入「刪除」")!=="刪除")return;
  await Promise.all([G.load(),E.load()]);
  const uid=AUTH.u.id,ph=G.S.games.filter(g=>g.author_id===uid).flatMap(g=>g.photos).concat(E.S.ev.filter(e=>e.author_id===uid).map(e=>e.photo).filter(Boolean));
  if(ph.length)await sb.storage.from("photos").remove(ph);
  const{error}=await sb.rpc("delete_my_account");if(error)return alert("刪除失敗："+zh(error));
  try{await sb.auth.signOut()}catch(e){}alert("帳號已刪除。");go("#/");
};
const adminAct=async(fn)=>{const{error}=await fn();if(error)return alert(zh(error));G.reset();E.reset();ROUTE(true)};
ACT["x.sus"]=el=>{if(!confirm("確定停權這位使用者？其公開內容會被隱藏，也無法再投稿或留言。"))return;return adminAct(()=>sb.from("profiles").update({suspended:true}).eq("id",el.dataset.id))};
ACT["x.unsus"]=el=>adminAct(()=>sb.from("profiles").update({suspended:false}).eq("id",el.dataset.id));
ACT["x.delrep"]=el=>adminAct(()=>sb.from("reports").delete().eq("id",el.dataset.id));

async function ROUTE(keep){
  const[p0,p1,p2]=(location.hash||"#/").replace(/^#\/?/,"").split("/");
  document.body.className=!p0?"v-games v-home":p0==="events"||p0==="share-event"?"v-events":p0==="games"||p0==="share-game"?"v-games":(p0==="account"||p0==="admin"||DOCS[p0])?"v-games v-events":"v-games v-home";
  if(!p0)homePage();
  else if(p0==="games")await G.show(p1,p2);
  else if(p0==="events")await E.show(p1,p2);
  else if(p0==="account")await accountPage();
  else if(p0==="admin")await adminPage();
  else if(DOCS[p0])doc(p0);
  else if(p0==="share-game"){history.replaceState(null,"","#/games");await G.show();G.openNew()}
  else if(p0==="share-event"){history.replaceState(null,"","#/events");await E.show();E.openNew()}
  else homePage();
  if(!keep)window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const mn=$("#menu");if(mn)mn.classList.remove("s")}});
document.addEventListener("click",e=>{
  if(!e.target.closest('[data-a="menu"]')){const mn=$("#menu");if(mn)mn.classList.remove("s")}
  const g=e.target.closest("[data-go]");if(g){go(g.dataset.go);shut();return}
  const a=e.target.closest("[data-a]");if(a&&!a.disabled){const f=ACT[a.dataset.a];f&&Promise.resolve(f(a)).catch(x=>alert(zh(x)))}
});
window.addEventListener("hashchange",()=>ROUTE());
async function setUser(sess){
  AUTH.u=sess?.user||null;AUTH.me=null;
  if(AUTH.u){const{data}=await sb.from("profiles").select("*").eq("id",AUTH.u.id).maybeSingle();AUTH.me=data}
  G.reset();E.reset();nav();await ROUTE(true);
}
sb.auth.onAuthStateChange((ev,sess)=>{if(ev==="PASSWORD_RECOVERY")setTimeout(pwBox,0);if(ev==="INITIAL_SESSION"||ev==="SIGNED_IN"||ev==="SIGNED_OUT")setTimeout(()=>setUser(sess),0)});

</script></body></html>
