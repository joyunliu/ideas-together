function bindWizard(ctx,draft,{validate,preview,submit}){
  const form=ctx.form,panels=[...form.querySelectorAll(".post-step")];
  const error=form.querySelector(".post-error"),back=form.querySelector("[data-back]");
  const next=form.querySelector("[data-next]"),send=form.querySelector("[data-submit]");
  const show=(step,focus=false)=>{

    form.querySelectorAll(".post-steps li").forEach((label,i)=>{
      if(i===step)label.setAttribute("aria-current","step");
      else label.removeAttribute("aria-current");
    });

  };
  const move=step=>{show(step,true);saveActiveDraft()};

    if(ctx.submitting||![0,1,2].every(check))return;

    controls.forEach(el=>{el.disabled=true});

    }catch(err){

async function shrink(file){
  const bitmap=await createImageBitmap(file);
  const canvas=document.createElement("canvas");
  const scale=Math.min(1,900/Math.max(bitmap.width,bitmap.height));
  canvas.width=Math.max(1,Math.round(bitmap.width*scale));
  canvas.height=Math.max(1,Math.round(bitmap.height*scale));
  try{canvas.getContext("2d").drawImage(bitmap,0,0,canvas.width,canvas.height)}
  finally{bitmap.close()}
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,"image/webp",.8));
  if(!blob||blob.type!=="image/webp")throw new Error("無法處理這張照片，請換一張 JPG 或 PNG。");
  return blob;
}

function filteredSlots(e,now,today){
  return upcomingSlots(e,now).filter(slot=>{
    const date=dateOf(slot.d),offset=Math.round((date-today)/864e5);
    if(S.when.size&&![...S.when].some(key=>{
      if(key==="today")return offset===0;
      if(key==="weekend"){
         const saturday=today.getDay()===0?-1:6-today.getDay();
         return offset>=Math.max(0,saturday)&&offset<=saturday+1;
       }
      if(key==="7d")return offset>=0&&offset<=7;
      return date.getMonth()===today.getMonth()&&date.getFullYear()===today.getFullYear();
    }))return false;
    if(!S.tod.size||e.flex_time)return true;
    const start=hh(slot.s),end=slot.e?hh(slot.e):e.continuous?24:start+.01;
    return [...S.tod].some(key=>start<TOD[key][1]&&end>TOD[key][0]);
  });
}
function list(){
  const now=new Date(),today=taipeiToday();
  return S.ev.filter(e=>{
    if(e.status!=="approved"||listingType(e)!=="event"||(S.favOnly&&!hasE(S.efavs,e.id)))return false;
    if(S.city.size&&!S.city.has(normalizeCity(e.city)))return false;
    if(S.age.size&&![...S.age].some(i=>{
      const band=EVENT_AGES[+i];
      return band&&(hasMonths(e)?e.age_min_month<=(band[2]+1)*12-1&&e.age_max_month>=band[1]*12:e.age_min<=band[2]&&e.age_max>=band[1]);
    }))return false;
    if(S.fee.size&&![...S.fee].some(f=>feeMatches(e,f)))return false;
    if(S.org.size&&!S.org.has(e.shared_organizer?"shared":e.profiles?.account_type||"personal"))return false;
    if(S.aud.size&&!S.aud.has(e.audience))return false;
    if(S.sessionType.size&&!S.sessionType.has(sessionType(e)))return false;

    return matches(S.q,[e.title,e.description,e.venue,e.address,e.district,e.city,nick(e),e.shared_organizer,e.shared_organizer?"轉貼他人活動":""]);
  }).map(e=>({event:e,slots:filteredSlots(e,now,today).filter(slot=>{

function cal(base){

function eventRegistration(e,slot){

    if(state==="walkin")return {label:"免報名・看活動公告",infoOnly:true};

      const venue=[e.district,e.venue].filter(Boolean).join(" → ");
      const activity=String(e.title).split("｜")[0];

    }

function applyScheduleBooking(schedule,booking){
  if(eachSlotHasBooking(schedule))return null;
  // A whole-event closure overrides slot statuses in public listings. Store a
  // shared closure on only the slots that use it when the schedule is mixed.
  if(["cancelled","full","postponed"].includes(booking)&&schedule?.some(slot=>Object.hasOwn(BOOKING,slot.booking))){

}

function cultureDescription(value){
  const text=cultureText(value);
  if(!/<[a-z!/]|&(?:#\d+|#x[\da-f]+|[a-z]+);/i.test(text))return text;
  const template=document.createElement("template");
  template.innerHTML=text.replace(/<br\b[^>]*>|<\/(?:p|div|li|tr|h[1-6])\s*>/gi,"\n");
  template.content.querySelectorAll("script,style,template").forEach(node=>node.remove());
  return template.content.textContent.trim();
}
function eventPlaceFromAddress(address){
  const normalized=searchText(address).replace(/^台灣\s*/,"");
  const named=CITIES.filter(city=>normalized.includes(city));
  const area=city=>DIST[city].find(d=>normalized.replaceAll(city,"").trimStart().replace(/^\d{3,6}\s*/,"").startsWith(searchText(d)));
  const cities=named.length?named:CITIES.filter(area);

}

function linkedEventItem(link,page={}){

      const date=taipeiDate(value);

    }
    return {day:value.slice(0,10),time:value.slice(11,16)};

function showLinkedDraft(draft,hasNewData){

    const fields=[...saved.fields];

      if(!field.id||field.id==="event-source"||!field.value)continue;
      const index=fields.findIndex(item=>item.id===field.id);
      if(index<0)fields.push(field);
      else if(!fields[index].value)fields[index]=field;
    }
    const slots=saved.FS?.length||saved.FD?.length?null:draft.FS;
    if(slots?.length){
      for(const field of fields)if(field.name==="event-fk")field.checked=field.value==="sched";
      if(!fields.some(field=>field.name==="event-fk"))fields.push({name:"event-fk",value:"sched",type:"radio",checked:true});

      title:saved.culture.title==="網路活動"?draft.culture.title:saved.culture.title,
      evidence:saved.culture.evidence||draft.culture.evidence

    form(null,{...saved,fields,FS:slots?.length?slots:saved.FS,...(culture?{culture}:{})});

function eventDraftFromText(raw) {

      .replace(/^(?:[-+•]\s+|\*\s+|#{1,6}\s+)/,"").replace(/\*\*|__/g,"")
      .replace(/\\+$/,"").trim()).filter(Boolean);
    const field=(pattern)=>lines.map(line=>line.match(pattern)?.[1]).find(Boolean)||"";
    const datePattern=/\b(20\d{2})\s*[-/.年]\s*(\d{1,2})\s*[-/.月]\s*(\d{1,2})(?:日)?/g;
    const datesOf=line=>[...line.matchAll(datePattern)].map(([,year,month,day])=>{
      const date=[year,month.padStart(2,"0"),day.padStart(2,"0")].join("-");
      const utc=new Date(date+"T00:00:00Z");
      return Number.isFinite(+utc)&&utc.toISOString().slice(0,10)===date?date:"";
    }).filter(Boolean);
    const dates=[...new Set(lines.flatMap(datesOf))];
    const explicit=lines.filter(line=>/^(?:上午場|下午場|第\s*\d+\s*場|場次)/.test(line));
    const timeLines=lines.filter(line=>/^(?:時間|活動時間)\s*:/.test(line));
    const periodTime=(hour,minute,period)=>{
      const n=Number(hour);
      if(n>23||period&&n>12)return "";
      const normalized=/下午|晚上|pm/i.test(period)?n%12+12:/上午|早上|am/i.test(period)?n%12:n;
      return String(normalized).padStart(2,"0")+":"+(minute||"00");
    };
    const sessions=(explicit.length?explicit:timeLines.length?timeLines:lines.filter(line=>datesOf(line).length===1)).flatMap(line=>{
      const localDates=[...new Set(datesOf(line))];
      const day=localDates.length===1?localDates[0]:!localDates.length&&dates.length===1?dates[0]:"";
      if(!day)return [];
      const ranges=/(上午|早上|下午|晚上)?\s*(\d{1,2})(?::([0-5]\d)|點(?:\s*([0-5]?\d)分)?)\s*(am|pm)?\s*[-–—~～至到]\s*(上午|早上|下午|晚上)?\s*(\d{1,2})(?::([0-5]\d)|點(?:\s*([0-5]?\d)分)?)\s*(am|pm)?/gi;
      return [...line.matchAll(ranges)].flatMap(([,p,h,m,minutes,ap,ep,eh,em,endMinutes,eap])=>{
        const start=periodTime(h,m||minutes?.padStart(2,"0"),ap||p||ep||eap);
        const end=periodTime(eh,em||endMinutes?.padStart(2,"0"),eap||ep||ap||p);
        return start&&end&&start<end?[{start:day+"T"+start,end:day+"T"+end}]:[];
      });
    });
    const feeText=field(/^(?:費用|票價|報名費)\s*:\s*(.+)/);
    const amount=feeText.match(/^(?:NT\$\s*)?(\d{1,5})\s*元?$/i)
      ||feeText.match(/(?:每組|每人|每場|新台幣|新臺幣|NT\$)\s*(\d{1,5})\s*元?(?!\d)/i);
    const place=field(/^(?:活動地點|地點|場館)\s*:\s*(.+)/);
    const location=place.match(/^(.*?)\s*((?:台|臺)北市|(?:台|臺)中市|(?:台|臺)南市|(?:台|臺)東縣|新北市|高雄市|桃園市|[\p{Script=Han}]{2}[縣市])(?=[\p{Script=Han}\d])/u);
    const oldDates=dates.length>0&&dates.every(day=>day<ymd(taipeiToday()));
    const intro=lines.findIndex(line=>/^(?:活動簡介|活動說明|活動介紹|簡介)$/.test(line));
    const description=field(/^(?:活動簡介|活動說明|活動介紹|簡介)\s*:\s*(.+)/)
      ||(intro>=0?lines.slice(intro+1).filter(line=>!/^(?:時間|活動時間|地點|活動地點|場館|費用|票價|報名費)\s*:/.test(line)).join("\n\n"):"");
    return {
      title:field(/^(?:活動名稱|活動標題|標題)\s*:\s*(.+)/),
      venue:location?.[1]?.trim()||place,
      address:field(/^地址\s*:\s*(.+)/)||(location?place.slice(location.index+location[1].length).trim():""),
      organizer:field(/^(?:主辦單位|主辦方)\s*:\s*(.+)/),
      age:field(/^(?:適合年齡|參加對象|活動對象|對象)\s*:\s*(.+)/),
      description,
      fee:/^(免費|免費參加|免費入場)[。！!]?$/u.test(feeText)?0:amount?Number(amount[1]):undefined,
      fee_note:field(/^費用說明\s*:\s*(.+)/)||(amount&&amount[0]!==feeText?feeText:""),
      booking_status:/^(?:已額滿|皆已額滿|全數額滿)$/.test(field(/^報名狀態\s*:\s*(.+)/))?"full":undefined,
      start:!oldDates&&dates.length===1?dates[0]:undefined,sessions:oldDates?[]:sessions,
      warning:oldDates?"公告日期 "+dates.join("、")+" 已過，未帶入場次。請先核對活動年份。":""
    };
  }

function tv(id){
  const hour=$("#"+id+"h").value,minute=$("#"+id+"m").value.trim();
  if(!hour)return "";
  if(minute&&(!/^\d{1,2}$/.test(minute)||+minute>59))return null;
  return hour+":"+(minute||"0").padStart(2,"0");
}
function readTiming(editing){
  const k=document.querySelector("[name=event-fk]:checked")?.value;
  const val=id=>$("#event-"+id).value;
  const fail=error=>({error});
  if(!k)return fail("請先選擇活動日期安排。");
  const continuous=k==="range"&&$("#event-fcont").checked;
  const flex_time=k!=="sched"&&!continuous&&$("#event-fx").checked;
  let start=k==="sched"?"":flex_time?"00:00":tv("event-fs1");
  let end=k==="sched"||flex_time?"":tv("event-fe1");
  if(start===null||end===null)return fail("分鐘請輸入 00 到 59。");
  let first="",last="",dates=null,schedule=null;
  if(k==="single")first=val("fd1");
  if(k==="range"){
    first=val("fr1");last=val("fr2");
    if(!last)return fail("請選擇結束日期。");
    if(first&&last<=first)return fail("結束日期需晚於開始日期。");
  }
  if(k==="dates"){
    if(FD.length<2)return fail("請至少加入兩個日期。");
    dates=[...FD].sort();
  }
  if(k==="sched"){
    syncSch();
    if(!FS.length)return fail("請加入至少一個場次。");
    if(FS.some(slot=>!slot.s||slot.e===null))return fail("請填寫每一場的開始時間，分鐘請輸入 00 到 59。");
    if(FS.some(slot=>slot.e&&slot.e<=slot.s))return fail("每一場的結束時間需晚於開始時間。");
    schedule=FS.map(({d,s,e,booking})=>({d,s,e:e||null,...(Object.hasOwn(BOOKING,booking)?{booking}:{})})).sort((a,b)=>a.d.localeCompare(b.d)||a.s.localeCompare(b.s));
    if(new Set(schedule.map(slot=>slot.d+" "+slot.s)).size!==schedule.length)return fail("同一天的場次請填寫不同的開始時間。");
    dates=[...new Set(schedule.map(slot=>slot.d))];
    start=schedule[0].s;
    end=schedule.at(-1).e||"";
  }
  if(dates){first=dates[0];last=dates.at(-1)}
  if(!first||!start)return fail("請填寫活動日期與開始時間。");
  if(continuous&&!end)return fail("請填寫最後一天的結束時間。");
  if(!continuous&&k!=="sched"&&end&&end<=start)return fail("結束時間需晚於開始時間。");
  const st=eventTime(first,start);
  let en=last?eventTime(last,end||"23:59"):end?eventTime(first,end):null;
  if(schedule)en=new Date(Math.max(...schedule.map(slot=>+eventTime(slot.d,slot.e||"23:59:59"))));
  if(!Number.isFinite(+st)||(en&&!Number.isFinite(+en)))return fail("日期或時間格式不正確。");
  const exhibition=$("#event-listing-type").value==="exhibition";
  if(exhibition&&(flex_time||!["single","range"].includes(k)))return fail("展覽請選單日或連續日期範圍，並填寫開放時間。");
  if($("#event-listing-type").value==="event"&&flex_time)return fail("自行預約請選「固定活動與自行預約」。");
  if(!editing&&(exhibition?(en||eventTime(first,"23:59:59"))<new Date():flex_time?first<ymd(taipeiToday()):st<new Date()))return fail("活動開始時間需在現在之後。");
  if($("#event-listing-type").value==="event"&&first>windowEnd(new Date()))return fail("一般活動只收錄未來三個月內開始的活動。");
  const maxRange=exhibition?366:31;
  if(k==="range"&&(en-st)/864e5>maxRange)return fail("日期範圍最長 "+maxRange+" 天。");
  if(dates&&(en-st)/864e5>90)return fail("多日活動的日期範圍最長 90 天。");
  return {row:{start_at:st.toISOString(),end_at:en?.toISOString()||null,flex_time,continuous,dates,schedule}};
}

};
const resourceFilterFields={
  city:["地區",[[E.ONLINE,E.ONLINE],...E.CITIES.map(city=>[city,city])]],
  fee:["費用",[["free","免費"],["paid","付費"]]],

function resourceMatchesBooking(e,slot,filter){
  if(!filter)return true;
  const state=E.bookingState(e,slot);
  if(filter==="walkin")return state==="walkin";
  if(filter==="flex")return e.flex_time&&state!=="walkin";
  return e.flex_time&&state!=="walkin"||["open","waitlist","upcoming","full"].includes(state);
}
function resourceRows(records,category,filters,now=new Date()){
  const exhibition=category==="exhibitions";
  return records.flatMap(e=>{
    if(filters.city&&E.normalizeCity(e.city)!==filters.city)return [];
    if(filters.age!==""&&!E.includesAge(e,Number(filters.age)))return [];
    if(filters.fee&&!E.feeMatches(e,filters.fee))return [];
    if(!matches(filters.q,[e.title,e.description,e.city,e.district,e.venue,e.address,e.visit_note,E.nick(e),e.shared_organizer]))return [];
    if(exhibition){
      const [start,end]=E.exhibitionPeriod(e);
      if(filters.day&&(filters.day<start||filters.day>end)||!resourceMatchesBooking(e,null,filters.booking))return [];
      return [{e,day:filters.day}];
    }
    const slots=E.upcomingSlots(e,now);
    const first=slots.find(slot=>{
      const weekend=[0,6].includes(new Date(slot.d+"T00:00:00").getDay());
      return (!filters.week||(!e.flex_time&&(filters.week==="weekend")===weekend))&&resourceMatchesBooking(e,slot,filters.booking);
    });
    if(!first&&(slots.length||filters.week||!resourceMatchesBooking(e,null,filters.booking)))return [];
    return [{e,first}];
  }).sort((a,b)=>exhibition?Date.parse(a.e.start_at)-Date.parse(b.e.start_at):
    (a.first?.d||"9999").localeCompare(b.first?.d||"9999")||(a.first?.s||"").localeCompare(b.first?.s||""));
}
function resourceCard({e,first,day}){
  const exhibition=E.listingType(e)==="exhibition";
  const timing=exhibition?E.exhibitionDates(e):first?(e.flex_time?"可約日期 "+E.slotText(first):E.slotText(first)):"近期場次請查主辦方公告";
  const place=[(e.city||"")+(e.district||""),e.venue].filter(Boolean).join(" · ");
  const total=exhibition||e.flex_time?0:E.eventSlots(e).length;
  const href=E.eventLink(e.id,day||first?.d,first&&!e.flex_time&&!e.continuous?E.attendanceKey(first):"");
  const official=importURL(e.link);
  return `<article class="next-resource-card"><div><p class="next-resource-date">${exhibition?"展期":first&&e.flex_time?"預約":"場次"} · ${esc(timing)}</p><h3><a href="${esc(href)}">${esc(e.title)}</a></h3>
    <div class="resource-facts"><span class="t event-label event-tag-age">${esc(E.ageTxt(e))}</span><span class="t event-label event-tag-fee">${E.feeTxt(e)}</span>${E.bookingBadge(e,first)}${total?`<span class="t event-label event-tag-session">共 ${total} 場</span>`:""}</div>
    <p>${esc(place)}</p>${exhibition||e.visit_note?`<p class="visit-note mu">${esc(exhibition?E.exhibitionVisit(e):e.visit_note)}</p>`:""}</div>
    <div class="next-resource-actions"><a class="event-official-button" href="${esc(exhibition&&official?official:href)}" ${exhibition&&official?'target="_blank" rel="noopener noreferrer"':""}>${exhibition?(official?"查看主辦方公告 ↗":"查看展覽"):"查看場次與預約"}</a></div></article>`;
}
function resourceBrowse(key,records){
  const exhibition=key==="exhibitions",filters=resourceFilters[key];
  const select=field=>{
    const [label,options]=resourceFilterFields[field];
    return `<label>${exhibition&&field==="booking"?"是否需預約":label}<select name="${field}"><option value="">不限</option>${options.filter(([v])=>!(exhibition&&field==="booking"&&v==="flex")).map(([value,text])=>`<option value="${value}" ${filters[field]===value?"selected":""}>${text}</option>`).join("")}</select></label>`;
  };
  const age=`<label>孩子年齡（歲）<input name="age" type="number" min="0" max="120" step="1" inputmode="numeric" placeholder="例如 4" value="${esc(filters.age)}"></label>`;
  const day=`<label>想去的日期<input name="day" type="date" min="${E.ymd(E.taipeiToday())}" value="${esc(filters.day)}"></label>`;
  $("#resource-browse").innerHTML=`<section class="filter-panel"><div class="resource-filters">
    <label>關鍵字<input name="q" type="search" value="${esc(filters.q)}"></label>${select("city")}${exhibition?day:age}</div>
    <details class="browse-filters" ${filters.open?"open":""}><summary>更多條件</summary><div class="resource-filters">${exhibition?age:select("week")}${select("fee")}${select("booking")}</div></details></section>
    <div class="discovery-results"><div class="filter-actions"><span id="resource-count" aria-live="polite"></span><button data-a="resource.clear">清除所有篩選</button></div><div id="resource-results"></div></div>`;
  $("#resource-browse details").ontoggle=ev=>{filters.open=ev.currentTarget.open};
  const draw=()=>{
    const rows=resourceRows(records,key,filters);
    $("#resource-count").textContent=`找到 ${rows.length} 筆`;
    $("#resource-results").innerHTML=rows.length?`<div class="resource-grid">${rows.map(resourceCard).join("")}</div>`:
      '<div class="empty-state"><strong>找不到符合條件的項目</strong><p>試著調整關鍵字、地區或其他條件。</p><button data-a="resource.clear">清除所有篩選</button></div>';
  };
  const search=$('#resource-browse [name="q"]');
  bindSearch(search,value=>{filters.q=value},draw);
  $("#resource-browse").onchange=ev=>{
    const el=ev.target;
    if(!el.name||el===search||!el.validity.valid)return;
    filters[el.name]=el.value;
    draw();
  };
  $("#resource-browse").onclick=ev=>{
    if(!ev.target.closest('[data-a="resource.clear"]'))return;
    for(const el of $("#resource-browse").querySelectorAll("input,select"))filters[el.name]=el.value="";
    draw();
    search.focus({preventScroll:true});
  };
  draw();
}

const IMPORT_FIELDS={"title":"名稱","description":"活動說明","start_at":"開始時間","end_at":"結束時間","city":"縣市","district":"行政區","venue":"場館","address":"地址","age_min":"起始年齡","age_max":"結束年齡","fee":"費用","fee_note":"費用說明","link":"官方連結","map_link":"地圖連結","audience":"參加對象","flex_time":"自行預約","dates":"活動日期","continuous":"跨日連續","schedule":"場次與報名狀態","shared_organizer":"主辦方","series_booking":"整期報名","recurrence_note":"固定舉辦說明","age_detail":"適齡說明","age_min_month":"起始月齡","age_max_month":"結束月齡","booking_status":"報名狀態","booking_checked_at":"查核時間","listing_type":"刊登分類","visit_note":"參觀與預約方式","related_exhibition_id":"相關展覽"};
const IMPORT_BOOKING={walkin:"免報名",open:"有正取名額",waitlist:"僅候補",upcoming:"尚未開放",check:"請自行確認",full:"已額滿",cancelled:"已取消",postponed:"已延期"};
const IMPORT_CATEGORIES={event:"單場與短期活動",exhibition:"展覽",resource:"固定活動與自行預約"};
const IMPORT_PERIODS={today:"今天",week:"本週",all:"全部待發布"};
const FAMILY_AUDIENCE=/親子|家長|孩子|小孩|孩童|兒童|兒少|學童|幼兒|小朋友|青少年|國小|寶寶/;
const importDateTime=new Intl.DateTimeFormat("zh-TW",{timeZone:"Asia/Taipei",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hourCycle:"h23"});
function importURL(value){
  try{
    const url=new URL(value);
    return ["http:","https:"].includes(url.protocol)&&!url.username&&!url.password?url.href:"";
  }catch{return ""}
}
function importSource(url){
  const host=new URL(url).hostname;
  if(host==="lovebaby.sw.ntpc.gov.tw")return "新北育兒資訊網";
  if(host==="atpass.ntpclib.gov.tw")return "新北市立圖書館";
  if(host.endsWith(".arte.gov.tw"))return "國立臺灣藝術教育館";
  if(host==="www.kmseh.gov.tw")return "高雄市立社會教育館";
  if(host==="www.library.taichung.gov.tw")return "臺中市立圖書館";
  return host.slice(0,100);
}
function importDay(value){
  return new Date(Date.parse(value)+8*3600000).toISOString().slice(0,10);
}
function importPeriod(rows,period,now=new Date()){
  if(period==="all")return rows;
  const today=importDay(now.toISOString());
  const day=new Date(today+"T00:00:00Z"),weekday=(day.getUTCDay()+6)%7;
  const monday=new Date(+day-weekday*86400000).toISOString().slice(0,10);
  const sunday=new Date(+day+(6-weekday)*86400000).toISOString().slice(0,10);
  return rows.filter(row=>{
    const date=importDay(row.suggested_at);
    return period==="today"?date===today:date>=monday&&date<=sunday;
  });
}
function importValue(key,value){
  if(value===null||value===undefined||value==="")return "未填寫";
  if(key==="schedule"&&Array.isArray(value))return value.map(slot=>[slot.d,slot.s+(slot.e?"–"+slot.e:""),IMPORT_BOOKING[slot.booking]||""].filter(Boolean).join(" ")).join("\n")||"未填寫";
  if(key==="booking_status")return IMPORT_BOOKING[value]||value;
  if(key==="listing_type")return IMPORT_CATEGORIES[value]||value;
  if(key==="audience")return E.AUD[value]||value;
  if(key==="related_exhibition_id")return E.S.ev.find(e=>e.id===value)?.title||value;
  if(key.endsWith("_at")&&!Number.isNaN(Date.parse(value)))return importDateTime.format(new Date(value));
  if(Array.isArray(value))return value.join("、");
  if(typeof value==="boolean")return value?"是":"否";
  if(typeof value==="object")return JSON.stringify(value);
  return String(value);
}
async function loadImportQueue(signal){
  const query=sb.from("event_import_suggestions")
    .select("id,event_id,source_name,source_url,audience_evidence,changes,base_record,suggested_at,events!inner(status)")
    .is("published_at",null).order("suggested_at",{ascending:false}).limit(500);
  const {data,error}=await (signal?query.abortSignal(signal):query);
  if(error)return {rows:[],error};
  return {rows:(data||[]).filter(row=>row.events&&row.base_record&&
    row.changes&&row.events.status===row.base_record.status),error:null};
}
function showImportQueue(queue){
  const panel=$("#event-import-queue");
  if(!panel)return;
  if(queue.error){
    panel.innerHTML='<section class="card-box"><h3>建議匯入與更新</h3><p class="mu">目前讀不到建議清單。</p><button data-a="x.reloadQueue">重試</button></section>';
    return;
  }
  const rows=importPeriod(queue.rows,ADM.importPeriod);
  const cards=rows.map(row=>{
    const fields=Object.entries(row.changes),update=fields.length>0;
    const old=row.base_record,proposed={...old,...row.changes};
    const url=importURL(row.source_url);
    const changes=update?`<dl class="import-changes">${fields.map(([key,value])=>`<div><dt>${esc(IMPORT_FIELDS[key]||key)}</dt><dd>現行：${esc(importValue(key,old[key]))}</dd><dd>建議：${esc(importValue(key,value))}</dd></div>`).join("")}</dl>`:
      `<p>${esc(proposed.description).replace(/\n/g,"<br>")}</p>${proposed.schedule?.length?`<dl class="import-changes"><dt>全部場次</dt><dd>${esc(importValue("schedule",proposed.schedule))}</dd></dl>`:""}`;
    const category=IMPORT_CATEGORIES[E.listingType(proposed)];
    return `<article class="cm"><label class="import-suggestion-heading"><input type="checkbox" data-import-id="${row.id}"><b>${esc(proposed.title)}</b><span class="t ${update?"ag":"ok"}">${update?"更新建議":"新增活動"}</span></label>
      <p class="mu">${esc(category)} · ${esc(proposed.city)}${esc(proposed.district||"")} · ${esc(E.ageTxt(proposed))} · ${esc(E.feeTxt(proposed))}</p>
      <p>${esc(E.listingType(proposed)==="exhibition"?E.exhibitionDates(proposed):E.tRange(proposed))}</p>
      <div class="r import-suggestion-source"><span class="mu">${esc(row.source_name)} · ${esc(importDateTime.format(new Date(row.suggested_at)))}</span>
        ${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">查看來源 ↗</a>`:""}<a href="#/events/e/${row.event_id}">${update?"看目前活動":"看完整待審活動"}</a></div>
      ${row.audience_evidence?`<p class="mu">來源標示對象：${esc(row.audience_evidence)}</p>`:""}
      <details><summary>${update?"比較目前與建議內容":"預覽活動內容"}</summary>${changes}</details></article>`;
  }).join("");
  panel.innerHTML=`<section class="card-box" aria-labelledby="event-import-title"><h3 id="event-import-title" style="margin-top:0">建議匯入與更新</h3>
    <p class="mu">先核對來源和內容，再勾選要一次發布的項目。更新建議會套用到原活動。</p>
    <div class="r">${Object.entries(IMPORT_PERIODS).map(([key,label])=>`<button data-import-period="${key}" aria-pressed="${ADM.importPeriod===key}" class="${ADM.importPeriod===key?"on":""}">${label}（${importPeriod(queue.rows,key).length}）</button>`).join("")}</div>
    ${rows.length?`<fieldset style="padding:0;margin:0;border:0;min-width:0" aria-label="選擇要發布的活動">
      <div class="r import-toolbar"><label class="import-select-all"><input id="import-all" type="checkbox"> 全選這一頁</label><button class="p" id="import-publish" disabled>審核並發布所選</button><span class="mu" id="import-count" role="status"></span></div>${cards}
    </fieldset>`:'<p class="mu">這個期間沒有待發布的建議。</p>'}
    <p class="mu" id="import-message" role="status"></p></section>`;
  panel.querySelectorAll("[data-import-period]").forEach(button=>button.onclick=()=>{
    ADM.importPeriod=button.dataset.importPeriod;
    showImportQueue(queue);
    panel.querySelector(`[data-import-period="${ADM.importPeriod}"]`)?.focus();
  });
  if(!rows.length)return;
  const all=panel.querySelector("#import-all"),publish=panel.querySelector("#import-publish");
  const boxes=[...panel.querySelectorAll("[data-import-id]")];
  const sync=()=>{
    const count=boxes.filter(box=>box.checked).length;
    publish.disabled=count===0;
    all.checked=count===boxes.length;
    all.indeterminate=count>0&&count<boxes.length;
    panel.querySelector("#import-count").textContent=`已選 ${count} 筆`;
  };
  boxes.forEach(box=>box.onchange=sync);
  all.onchange=()=>{boxes.forEach(box=>{box.checked=all.checked});sync()};
  publish.onclick=async()=>{
    if(!AUTH.me?.is_admin||AUTH.me.suspended)return;
    const ids=boxes.filter(box=>box.checked).map(box=>box.dataset.importId);
    if(!ids.length||!confirm(`確定將所選的 ${ids.length} 筆建議發布到網站？`))return;
    const fieldset=publish.closest("fieldset"),message=panel.querySelector("#import-message");
    fieldset.disabled=true;
    panel.querySelectorAll("[data-import-period]").forEach(button=>button.disabled=true);
    message.textContent="正在發布所選建議…";
    try{
      const {data,error}=await sb.rpc("publish_event_import_suggestions",{p_ids:ids});
      if(error)throw error;
      E.reset();
      if(panel.isConnected)await ROUTE(true);
      showToast(`已審核並發布 ${data} 筆`);
    }catch(error){
      message.textContent=zh(error);
    }finally{
      fieldset.disabled=false;
      panel.querySelectorAll("[data-import-period]").forEach(button=>button.disabled=false);
    }
  };
  sync();
}

ACT["x.queueEvent"]=async button=>{
  if(!AUTH.me?.is_admin||AUTH.me.suspended)return;
  const event=E.S.ev.find(row=>row.id===button.dataset.id&&row.status==="pending"&&row.shared_organizer);
  const url=event&&importURL(event.link);
  if(!url)return;
  const evidence=prompt("請先查看官方活動頁，輸入來源明確標示的親子、家長或兒童對象文字。")?.trim();
  if(evidence===undefined)return;
  if(evidence.length>160||!FAMILY_AUDIENCE.test(evidence)){
    showToast("請填寫來源標示的對象文字（160 字內）。");
    return;
  }
  button.disabled=true;
  try{
    const {error}=await sb.from("event_import_suggestions").insert({event_id:event.id,source_name:importSource(url),source_url:url,audience_evidence:evidence});
    if(error)throw error;
    if(button.isConnected)await ROUTE(true);
    showToast("已加入建議清單");
  }finally{button.disabled=false}
};

function webActivityQuery(city,first,last){
  const start=new Date(first+"T00:00:00Z"),end=new Date(last+"T00:00:00Z");
  const terms=[];
  if((end-start)/864e5<7){
    for(const date=new Date(start);date<=end;date.setUTCDate(date.getUTCDate()+1)){
      const month=date.getUTCMonth()+1,day=date.getUTCDate();
      terms.push(`"${month}/${day}"`,`"${month}月${day}日"`,`"${date.toISOString().slice(0,10)}"`);
    }
  }else{
    const monthCount=(end.getUTCFullYear()-start.getUTCFullYear())*12+end.getUTCMonth()-start.getUTCMonth()+1;
    const date=new Date(start);
    date.setUTCDate(1);
    if(monthCount>6){
      for(let year=start.getUTCFullYear();year<=end.getUTCFullYear()&&terms.length<6;year++)terms.push(String(year));
    }else{
      for(let i=0;i<monthCount;i++,date.setUTCMonth(date.getUTCMonth()+1)){
        terms.push(`"${date.getUTCFullYear()}年${date.getUTCMonth()+1}月"`);
      }
    }
  }
  const cities=[city,city.replace("台","臺")];
  const place=[...new Set(cities)].join(" OR ");
  return `(${place}) (親子活動 OR 親子館 OR 兒童活動 OR 親子共讀) (${terms.join(" OR ")})`;
}

const browseScroll=new Map();
let renderedHash="";
history.scrollRestoration="manual";
const isDetail=hash=>/^#\/(?:events\/e|games\/g)\//.test(hash);
const isBrowse=hash=>/^#\/(?:events|games|resources\/(?:exhibitions|fixed))?$/.test(hash);
function markCurrentNav(path){
  document.querySelectorAll("#nav [data-go]").forEach(button=>{
    const destination=button.dataset.go;
    const current=destination==="#/"+path||(["events","games"].includes(path.split("/")[0])&&destination==="#/"+path.split("/")[0]);
    if(current)button.setAttribute("aria-current","page");
    else button.removeAttribute("aria-current");
  });
}
async function ROUTE(keep){
  E.closeQuick();
  const previous=renderedHash;
  let hash=location.hash||"#/";
  if(!keep&&isDetail(hash)&&isBrowse(previous))browseScroll.set(previous,window.scrollY);
  const [path,query=""]=hash.replace(/^#\/?/,"").split("?");
  let [p0,p1,p2]=path.split("/");
  const shareType=p0==="share-game"?"game":p0==="share-event"?"event":null;
  if(shareType){
    p0=shareType==="game"?"games":"events";
    hash="#/"+p0;
    history.replaceState(null,"",hash);
  }
  document.body.className=!p0?"v-games v-home":p0==="events"?"v-events":p0==="games"?"v-games":(p0==="account"||p0==="admin"||DOCS[p0])?"v-games v-events":"v-games v-home";
  markCurrentNav(p0+(p0==="resources"&&p1?"/"+(p1==="official"?"websites":p1):""));
  try {
  if(!p0)await homePage();
  else if(p0==="games")await G.show(p1,p2);
  else if(p0==="events")await E.show(p1,p2,new URLSearchParams(query));
  else if(p0==="account")await accountPage();
  else if(p0==="admin")await adminPage();
  else if(p0==="resources")await resourcesPage(p1);
  else if(Object.hasOwn(DOCS,p0))doc(p0);
  else $("#app").innerHTML='<div class="empty-state"><strong>找不到這個頁面</strong><a href="#/">返回首頁</a></div>';
  }catch(error){if((location.hash||"#/")===hash)showLoadFailure();return}
  if((location.hash||"#/")!==hash)return;
  renderedHash=hash;
  analytics.pageView(hash);
  if(p0==="events"&&p1==="e"&&hash.split("?")[0]!==previous?.split("?")[0]&&$("#app [data-event-views]"))analytics.event("view_activity",{surface:"detail"});
  if(!keep)window.scrollTo({top:isDetail(previous)?browseScroll.get(hash)||0:0,behavior:"instant"});
  if(shareType)(shareType==="game"?G:E).openNew();
}
document.addEventListener("keydown",e=>{

  if($("#md").classList.contains("s"))ACT.shut();
  $("#menu")?.classList.remove("s");

document.addEventListener("click",e=>{
  if(!e.target.closest('[data-a="menu"]')&&$("#menu")?.classList.contains("s")){
    $("#menu").classList.remove("s");
    $('[data-a="menu"]')?.setAttribute("aria-expanded","false");
  }
  const eventCard=e.target.closest("[data-event-card]"),eventAnchor=e.target.closest("a");
  if(eventAnchor?.matches("[data-registration]")&&!/^#\/(account|admin)(?:[/?]|$)/.test(location.hash))analytics.event("click_registration");
  const plainClick=!e.defaultPrevented&&e.button===0&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey&&!e.altKey;
  const share=eventAnchor?.getAttribute("href");
  if(plainClick&&(share==="#/share-game"||share==="#/share-event")){
    e.preventDefault();
    (share==="#/share-game"?G:E).openNew(eventAnchor);
    return;
  }
  if(eventCard&&plainClick&&!e.target.closest("button")&&(!eventAnchor||eventAnchor.getAttribute("href")?.split("?")[0]==="#/events/e/"+eventCard.dataset.eventCard)){
    e.preventDefault();E.openQuick(eventCard.dataset.eventCard,eventCard.dataset.eventDay,eventCard.dataset.eventSlot);return;
  }
  const g=e.target.closest("[data-go]");if(g&&!e.target.closest("a[href]")){if(activeDraft?.submitting)return;ACT.shut();if(!activeDraft)go(g.dataset.go);return}
  const a=e.target.closest("[data-a]");if(a&&!a.disabled&&!activeDraft?.submitting){const f=ACT[a.dataset.a];f&&Promise.resolve(f(a)).catch(x=>alert(zh(x)))}
});
ACT["retry-route"]=()=>ROUTE(true);

let authUpdate=Promise.resolve(),authUserId;
function setUser(sess){
  const uid=sess?.user?.id||null;
  if(authUserId===uid)return authUpdate;
  authUserId=uid;
  authUpdate=(async()=>{
    if(activeDraft&&activeDraft.uid!==uid){activeDraft=null;shut()}
    const profile=uid?await sb.from("profiles").select("*").eq("id",uid).maybeSingle():null;
    if(authUserId!==uid)return;
    AUTH.u=sess?.user||null;
    AUTH.me=profile?.data||null;
    G.reset();E.reset();nav();
    await ROUTE(true);
  })();
  return authUpdate;
}
