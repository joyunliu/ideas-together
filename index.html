      }catch(e){}

    if(old?.type===type&&Array.isArray(old.fields)&&!drafts.some(d=>d.id==="legacy")){

        if(ids.has(f.id)||(type==="event"&&/^(sa\d+|sb\d+|fs1|fe1)[hm]$/.test(f.id)))return [{...f,id:type+"-"+f.id}];

  const controls=[...form.querySelectorAll("input, textarea, select")];

    const el=controls.find(x=>x.type===f.type&&(f.id?x.id===f.id:f.name&&x.name===f.name)&&(!choice||x.value===f.value));

function bindWizard(ctx,draft,{validate,preview,submit}){
  const form=ctx.form,panels=[...form.querySelectorAll(".post-step")];

async function savePost(ctx,table,row,files,previous,photoFields){
  const storage=sb.storage.from("photos"),uploaded=[];
  try{
    for(const file of files){
      const path=ctx.uid+"/"+crypto.randomUUID()+".webp";
      const blob=await shrink(file);
      const {error}=await storage.upload(path,blob,{contentType:blob.type,cacheControl:"31536000"});
      if(error)throw error;
      uploaded.push(path);
    }
    if(AUTH.u?.id!==ctx.uid)throw new Error("登入狀態已變更，請重新登入。");
    const data={...row,...photoFields(files.length?uploaded:previous),status:"pending",reject_reason:null};
    const result=ctx.postId
      ?await sb.from(table).update(data).eq("id",ctx.postId).select("id").single()
      :await sb.from(table).insert({...data,author_id:ctx.uid});
    if(result.error){
      // A lost response can leave the outcome unknown. Keep potentially referenced files.
      if(result.status===0||result.status>=500)uploaded.length=0;
      throw result.error;
    }
  }catch(err){
    if(uploaded.length)await storage.remove(uploaded).catch(()=>{});
    throw err;
  }
  if(files.length&&previous.length)await storage.remove(previous).catch(()=>{});
}

function filteredSlots(e,now,today){

      if(key==="today")return offset===0;
      if(key==="weekend")return [0,6].includes(date.getDay())&&offset>=0&&offset<=6;
      if(key==="7d")return offset>=0&&offset<=7;
      return date.getMonth()===today.getMonth()&&date.getFullYear()===today.getFullYear();
    }))return false;
    if(!S.tod.size||e.flex_time)return true;
    const start=hh(slot.s),end=slot.e?hh(slot.e):e.continuous?24:start+.01;

function tv(id){
  const hour=$("#"+id+"h").value,minute=$("#"+id+"m").value.trim();
  if(!hour)return "";
  if(minute&&(!/^\d{1,2}$/.test(minute)||+minute>59))return null;
  return hour+":"+(minute||"0").padStart(2,"0");
}
function readTiming(editing){
  const k=document.querySelector("[name=event-fk]:checked")?.value;
  const val=id=>$("#event-"+id).value;
  const fail=error=>({error});
  if(!k)return fail("請先選擇活動日期安排。");
  const continuous=k==="range"&&$("#event-fcont").checked;
  const flex_time=k!=="sched"&&!continuous&&$("#event-fx").checked;
  let start=k==="sched"?"":flex_time?"00:00":tv("event-fs1");
  let end=k==="sched"||flex_time?"":tv("event-fe1");
  if(start===null||end===null)return fail("分鐘請輸入 00 到 59。");
  let first="",last="",dates=null,schedule=null;
  if(k==="single")first=val("fd1");
  if(k==="range"){
    first=val("fr1");last=val("fr2");
    if(!last)return fail("請選擇結束日期。");
    if(first&&last<=first)return fail("結束日期需晚於開始日期。");
  }
  if(k==="dates"){
    if(FD.length<2)return fail("請至少加入兩個日期。");
    dates=[...FD].sort();
  }
  if(k==="sched"){
    syncSch();
    if(!FS.length)return fail("請加入至少一個場次。");
    if(FS.some(slot=>!slot.s||slot.e===null))return fail("請填寫每一場的開始時間，分鐘請輸入 00 到 59。");
    if(FS.some(slot=>slot.e&&slot.e<=slot.s))return fail("每一場的結束時間需晚於開始時間。");
    schedule=FS.map(({d,s,e,booking})=>({d,s,e:e||null,...(Object.hasOwn(BOOKING,booking)?{booking}:{})})).sort((a,b)=>a.d.localeCompare(b.d)||a.s.localeCompare(b.s));
    if(new Set(schedule.map(slot=>slot.d+" "+slot.s)).size!==schedule.length)return fail("同一天的場次請填寫不同的開始時間。");
    dates=[...new Set(schedule.map(slot=>slot.d))];
    start=schedule[0].s;
    end=schedule.at(-1).e||"";
  }
  if(dates){first=dates[0];last=dates.at(-1)}
  if(!first||!start)return fail("請填寫活動日期與開始時間。");
  if(continuous&&!end)return fail("請填寫最後一天的結束時間。");
  if(!continuous&&k!=="sched"&&end&&end<=start)return fail("結束時間需晚於開始時間。");
  const st=eventTime(first,start);
  let en=last?eventTime(last,end||"23:59"):end?eventTime(first,end):null;
  if(schedule)en=new Date(Math.max(...schedule.map(slot=>+eventTime(slot.d,slot.e||"23:59"))));
  if(!Number.isFinite(+st)||(en&&!Number.isFinite(+en)))return fail("日期或時間格式不正確。");
  if(!editing&&(flex_time?first<ymd(taipeiToday()):st<new Date()))return fail("活動開始時間需在現在之後。");
  if(k==="range"&&(en-st)/864e5>31)return fail("連續多日的活動最長 31 天。");
  if(dates&&(en-st)/864e5>90)return fail("多日活動的日期範圍最長 90 天。");
  return {row:{start_at:st.toISOString(),end_at:en?.toISOString()||null,flex_time,continuous,dates,schedule}};
}

function refreshDraftList(){
  const box=$("#draft-list");
  if(!box)return;
  const group=(type,label)=>{
    const drafts=readDrafts(type);
    if(!drafts.length)return "";
    let unnamed=0;
    const rows=drafts.map(d=>{
      const title=d.fields.find(f=>f.id===type+"-ft")?.value?.trim()||"草稿"+(++unnamed);
      const attrs=' data-type="'+type+'" data-id="'+esc(d.id)+'"';
      return '<div class="cm"><b class="draft-title">'+esc(title)+'</b><div class="r">'+
        '<button data-a="draft.open"'+attrs+'>繼續編輯</button>'+
        '<button class="d" data-a="draft.delete"'+attrs+'>刪除</button></div></div>';
    });
    return '<h4 style="margin:12px 0 6px">'+label+'</h4>'+rows.join("");
  };
  const game=AUTH.me?.account_type==="organization"?"":group("game","遊戲草稿");
  const event=group("event","活動草稿");
  box.innerHTML=game||event?'<div class="card-box" style="margin-top:14px">'+
    '<h3 style="margin:0 0 6px">尚未完成的草稿</h3>'+
    '<p class="mu" style="margin:0 0 8px">草稿儲存在目前這台裝置的瀏覽器中。</p>'+game+event+'</div>':"";
}
ACT["draft.open"]=el=>{
  if(!need())return;
  const {type,id}=el.dataset;
  if(type==="game"&&AUTH.me?.account_type==="organization")return;
  const draft=readDrafts(type).find(d=>d.id===id);
  if(!draft)return refreshDraftList();
  const games=type==="game",section=games?G:E;
  const post=draft.postId?(games?G.S.games:E.S.ev).find(x=>x.id===draft.postId&&x.author_id===AUTH.u.id):null;
  if(draft.postId&&!post)return showToast("原投稿已找不到，這份草稿無法繼續編輯");
  section.openDraft(post,draft);
};

ACT["x.sus"]=el=>{if(!confirm("確定停權這位使用者？其公開內容會被隱藏，也無法再投稿或留言。"))return;return adminAct(()=>sb.from("profiles").update({suspended:true}).eq("id",el.dataset.id))};
ACT["x.unsus"]=el=>adminAct(()=>sb.from("profiles").update({suspended:false}).eq("id",el.dataset.id));
ACT["x.delrep"]=el=>adminAct(()=>sb.from("reports").delete().eq("id",el.dataset.id));

async function ROUTE(keep){
  E.closeQuick();
  const[p0,p1,p2]=(location.hash||"#/").replace(/^#\/?/,"").split("/");
  document.body.className=!p0?"v-games v-home":p0==="events"||p0==="share-event"?"v-events":p0==="games"||p0==="share-game"?"v-games":(p0==="account"||p0==="admin"||DOCS[p0])?"v-games v-events":"v-games v-home";
  if(!p0)await homePage();
  else if(p0==="games")await G.show(p1,p2);
  else if(p0==="events")await E.show(p1,p2);
  else if(p0==="account")await accountPage();
  else if(p0==="admin")await adminPage();
  else if(p0==="resources")resourcesPage();
  else if(DOCS[p0])doc(p0);
  else if(p0==="share-game"){history.replaceState(null,"","#/games");await G.show();G.openNew()}
  else if(p0==="share-event"){history.replaceState(null,"","#/events");await E.show();E.openNew()}
  else await homePage();
  if(!keep)window.scrollTo(0,0);
}
document.addEventListener("keydown",e=>{if(e.key==="Escape"){const mn=$("#menu");if(mn)mn.classList.remove("s")}});
document.addEventListener("click",e=>{
  if(!e.target.closest('[data-a="menu"]')){const mn=$("#menu");if(mn)mn.classList.remove("s")}
  const eventCard=e.target.closest("[data-event-card]"),eventAnchor=e.target.closest("a");
  if(eventCard&&!e.defaultPrevented&&e.button===0&&!e.metaKey&&!e.ctrlKey&&!e.shiftKey&&!e.altKey&&
    !e.target.closest("button")&&(!eventAnchor||eventAnchor.getAttribute("href")==="#/events/e/"+eventCard.dataset.eventCard)){
    e.preventDefault();E.openQuick(eventCard.dataset.eventCard,eventCard.dataset.eventDay);return;
  }
  const g=e.target.closest("[data-go]");if(g&&!e.target.closest("a[href]")){if(activeDraft?.submitting)return;ACT.shut();if(!activeDraft)go(g.dataset.go);return}
  const a=e.target.closest("[data-a]");if(a&&!a.disabled&&!activeDraft?.submitting){const f=ACT[a.dataset.a];f&&Promise.resolve(f(a)).catch(x=>alert(zh(x)))}
});
window.addEventListener("hashchange",()=>ROUTE());
async function setUser(sess){
  if(activeDraft&&activeDraft.uid!==sess?.user?.id){activeDraft=null;shut()}
  AUTH.u=sess?.user||null;AUTH.me=null;
  if(AUTH.u){const{data}=await sb.from("profiles").select("*").eq("id",AUTH.u.id).maybeSingle();AUTH.me=data}
  G.reset();E.reset();nav();await ROUTE(true);
}
sb.auth.onAuthStateChange((ev,sess)=>{if(ev==="PASSWORD_RECOVERY")setTimeout(pwBox,0);if(ev==="INITIAL_SESSION"||ev==="SIGNED_IN"||ev==="SIGNED_OUT")setTimeout(()=>setUser(sess),0)});

</script></body></html>
