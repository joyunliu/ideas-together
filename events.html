  <div class="r">${[["single","單日活動"],["dates","多日活動（指定幾天）"],["range","連續多日（連續幾天）"],["sched","每天時間不同（逐日設定）"]].map(([v,t])=>`<label class="kopt"><input type="radio" name="fk" value="${v}" ${kind===v?"checked":""} onchange="kindUI()">${t}</label>`).join("")}</div>
  <p class="mu" id="khint" style="margin:0 0 10px"></p>
  <div id="k_single"><label>活動日期<input id="fd1" type="date" value="${kind==="single"&&st?ymd(st):""}"></label></div>
  <div id="k_dates"><label>指定日期（選好日期後按「加入」，至少 2 天）</label><div class="r"><input id="fdl" type="date" style="flex:1;margin:0"><button data-a="adddate">加入</button></div><div class="r" id="dchips"></div></div>
  <div id="k_sched"><label>指定日期（選好日期後按「加入」，每一天可以填不同的時間）</label><div class="r"><input id="fsl" type="date" style="flex:1;margin:0"><button data-a="addsch">加入</button></div><div id="schrows"></div></div>
  <div id="k_range"><div class="r"><label>開始日期<input id="fr1" type="date" value="${kind==="range"&&st?ymd(st):""}"></label><label>結束日期<input id="fr2" type="date" value="${kind==="range"&&en?ymd(en):""}"></label></div></div>
  <div id="tbox">
  <label class="mu" id="fxbox" style="display:block;margin:0 0 10px"><input type="checkbox" id="fx" style="width:auto;margin:0 6px 0 0" ${e&&e.flex_time?"checked":""} onchange="kindUI()">無特定時間／可自行預約</label>
  <div class="r" id="tprow"><label><span id="lbs"></span>${tp("fs1",e&&e.flex_time?null:st)}</label><label><span id="lbe"></span>${tp("fe1",e&&!e.flex_time&&endT(e)?en:null)}</label></div>
  <label class="mu" id="contbox" style="display:block;margin:0 0 10px"><input type="checkbox" id="fcont" style="width:auto;margin:0 6px 0 0" ${e&&e.continuous?"checked":""} onchange="kindUI()">跨日連續進行（例如住宿營隊，不是每天各有一段時間）</label>
  </div>
  <datalist id="mins"><option value="00"><option value="15"><option value="30"><option value="45"></datalist>
  <div class="r"><label>縣市<select id="fc" onchange="fillDist()"><option value="">請選擇縣市</option>${CITIES.map(c=>`<option ${e?.city===c?"selected":""}>${c}</option>`).join("")}</select></label><label>區／鄉鎮（選填）<select id="fz"></select></label></div>
  <label>活動地點<input id="fv" maxlength="60" placeholder="例如：場館或店家名稱" value="${esc(e?.venue)}"></label>
  ${org?`<label>完整地址<input id="fad" maxlength="100" value="${esc(e?.address)}"></label>`:""}
  <label>地圖連結（選填，例如 Google 地圖的分享連結）<input id="fmp" type="url" maxlength="300" placeholder="https://" value="${esc(e?.map_link)}"></label>
  <div class="r"><label>建議年齡（起）<select id="fa1">${ages(e?e.age_min:0)}</select></label><label>建議年齡（迄）<select id="fa2">${ages(e?e.age_max:12)}</select></label></div>
  <label>參與對象<select id="fau"><option value="family" ${!e||e.audience==="family"?"selected":""}>親子（家長與孩子一起）</option><option value="kids" ${e&&e.audience==="kids"?"selected":""}>只有孩子（家長不需陪同）</option><option value="parents" ${e&&e.audience==="parents"?"selected":""}>只有家長（例如講座）</option></select></label>
  <div class="r"><label>費用（元，免費填 0）<input id="ff" type="number" min="0" max="100000" value="${e?e.fee:0}"></label><label>費用說明（選填，例如：含材料費）<input id="fn" maxlength="60" value="${esc(e?.fee_note)}"></label></div>
  <label>活動說明<textarea id="fh" rows="6" maxlength="800">${esc(e?.description)}</textarea></label>
  <label>${org?"報名或詳情連結（必填）":"報名或詳情連結（選填）"}<input id="fl" type="url" maxlength="200" placeholder="https://" value="${esc(e?.link)}"></label>
  <label>活動照片（選填，1 張${e?"；不選就保留原圖":""}）<input id="fp" type="file" accept="image/*"></label>
  <div class="r"><button class="p" id="fsub">${e?"儲存並重新送審":"送出審核"}</button><button data-a="shut">取消</button></div><div class="mu" id="fe"></div>`);
  $("#fsub").onclick=()=>submit(e);fillDist(e&&e.district);kindUI();drawChips();drawSch();
}
async function shrink(f){
  const bm=await createImageBitmap(f),k=Math.min(1,900/Math.max(bm.width,bm.height)),c=document.createElement("canvas");
  c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/webp",.8));
}
function tv(id){const h=$("#"+id+"h").value;if(!h)return"";let m=$("#"+id+"m").value.trim();if(m==="")m="00";if(!/^\d{1,2}$/.test(m)||+m>59)return null;return h+":"+m.padStart(2,"0")}
async function submit(e){
  const er=$("#fe"),org=S.me?.account_type==="organization",v=i=>$("#"+i)?$("#"+i).value.trim():"";
  const k=(document.querySelector("[name=fk]:checked")||{}).value||"";
  if(!k)return er.textContent="請先選擇活動類型（單日、多日或連續多日）。";
  const cont=k==="range"&&$("#fcont").checked,fx=k!=="sched"&&!cont&&$("#fx").checked;
  let s1=k==="sched"?"":fx?"00:00":tv("fs1"),e1=k==="sched"?"":fx?"":tv("fe1"),sched=null;
  const t=v("ft"),h=v("fh"),lk=v("fl"),mp=v("fmp"),f=+v("ff"),a1=+v("fa1"),a2=+v("fa2"),file=$("#fp").files[0];
  if(s1===null||e1===null)return er.textContent="分鐘請輸入 00 到 59。";
  let d1="",d2="",dates=null;
  if(k==="single")d1=v("fd1");
  else if(k==="dates"){if(FD.length<2)return er.textContent="多日活動請至少加入 2 個日期。";dates=[...FD];d1=dates[0];d2=dates[dates.length-1]}
  else if(k==="sched"){syncSch();if(FS.length<2)return er.textContent="請至少加入 2 個日期。";for(const x of FS){if(x.s===null||x.e===null||!x.s)return er.textContent="請填寫每一天的開始時間（分鐘請輸入 00 到 59）。";if(x.e&&x.e<=x.s)return er.textContent="每一天的結束時間需晚於開始時間。"}dates=FS.map(x=>x.d);sched=FS.map(x=>({d:x.d,s:x.s,e:x.e||null}));d1=dates[0];d2=dates[dates.length-1];s1=FS[0].s;e1=FS[FS.length-1].e||""}
  else{d1=v("fr1");d2=v("fr2");if(!d2)return er.textContent="請選擇結束日期。";if(d1&&d2<=d1)return er.textContent="結束日期需晚於開始日期。"}
  if(!t||!h||!d1||!s1)return er.textContent="請填寫活動主題、日期、開始時間與活動說明。";
  if(cont&&!e1)return er.textContent="跨日連續進行的活動，請填寫最後一天的結束時間。";
  const st=new Date(d1+"T"+s1),en=k==="single"?(e1?new Date(d1+"T"+e1):null):new Date(d2+"T"+(e1||"23:59"));
  if(isNaN(st))return er.textContent="日期或時間格式不正確。";
  if(!e&&(fx?d1<ymd(new Date()):st<new Date()))return er.textContent="活動時間需在現在之後。";
  if(k==="single"&&en&&en<=st)return er.textContent="結束時間需晚於開始時間。";
  if(k!=="single"&&k!=="sched"&&!cont&&e1&&e1<=s1)return er.textContent="結束時間需晚於開始時間（多日活動的時間代表每天的時段）。";
  if(cont&&en<=st)return er.textContent="最後一天的結束時間需晚於開始。";
  if(k==="range"&&(en-st)/864e5>31)return er.textContent="連續多日的活動最長 31 天。";
  if((k==="dates"||k==="sched")&&(en-st)/864e5>90)return er.textContent="多日活動的日期範圍最長 90 天。";
  if(!$("#fc").value)return er.textContent="請選擇縣市。";
  if(a2<a1)return er.textContent="適合年齡的範圍有誤。";
  if(!(f>=0&&f<=100000))return er.textContent="費用需在 0 到 100000 之間。";
  if(lk&&!/^https?:\/\/[^\s]+$/i.test(lk))return er.textContent="連結需以 http:// 或 https:// 開頭。";
  if(mp&&!/^https?:\/\/[^\s]+$/i.test(mp))return er.textContent="地圖連結需以 http:// 或 https:// 開頭。";
  if(org&&!lk)return er.textContent="商家／機構需提供報名或詳情連結。";
  if(file&&file.size>8*1024*1024)return er.textContent="照片超過 8 MB。";
  $("#fsub").disabled=true;er.textContent="送出中…";
  try{
    let photo=e?e.photo:null;
    if(file){const p=S.u.id+"/"+crypto.randomUUID()+".webp";const{error}=await sb.storage.from("photos").upload(p,await shrink(file),{contentType:"image/webp"});if(error)throw error;if(e&&e.photo)await sb.storage.from("photos").remove([e.photo]);photo=p}
    const row={title:t,description:h,start_at:st.toISOString(),end_at:en?en.toISOString():null,city:$("#fc").value,district:v("fz")||null,venue:v("fv")||null,address:org?(v("fad")||null):null,age_min:a1,age_max:a2,fee:f,fee_note:v("fn")||null,link:lk||null,map_link:mp||null,audience:$("#fau").value,flex_time:fx,continuous:cont,dates,schedule:sched,photo,status:"pending",reject_reason:null};
    const{error}=e?await sb.from("events").update(row).eq("id",e.id):await sb.from("events").insert({...row,author_id:S.u.id});
    if(error)throw error;await load();shut();alert("已送出，審核通過後就會公開。");location.hash="#/me";route();
  }catch(x){er.textContent="送出失敗："+zh(x);$("#fsub").disabled=false}
}
async function route(){
  const[,k,id]=(location.hash||"#/").split("/");
  if(k==="e")detail(id);else if(k==="me")me();else if(k==="admin")await admin();else if(k==="share"){home();history.replaceState(null,"","#/");act.new()}else home();
  window.scrollTo(0,0);
}
async function setUser(sess){
  S.u=sess?.user||null;S.me=null;
  if(S.u){const{data}=await sb.from("profiles").select("*").eq("id",S.u.id).maybeSingle();S.me=data}
  nav();await load();route();
}
window.addEventListener("hashchange",route);
sb.auth.onAuthStateChange((ev,sess)=>{if(ev==="PASSWORD_RECOVERY")setTimeout(pwBox,0);if(ev==="INITIAL_SESSION"||ev==="SIGNED_IN"||ev==="SIGNED_OUT")setTimeout(()=>setUser(sess),0)});

</script></body></html>
