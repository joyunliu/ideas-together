function list(){
  const q=S.q.trim().toLowerCase(),now=new Date(),t0=d0(now);
  return S.ev.filter(e=>e.status==="approved"&&endOf(e)>=now).filter(e=>{
    const ds=daysOf(e).map(d=>[d,Math.round((d-t0)/864e5)]);
    if(S.city&&e.city!==S.city)return false;
    if(S.age>=0&&!(e.age_min<=S.age&&S.age<=e.age_max))return false;
    if(S.fee==="free"&&e.fee>0)return false;if(S.fee==="paid"&&e.fee===0)return false;if(+S.fee&&e.fee>+S.fee)return false;
    if(S.org&&e.profiles?.account_type!==S.org)return false;
    if(S.aud&&e.audience!==S.aud)return false;
    if(S.tod){const[a,b]=todR(e);if(S.tod==="all"){if(!(e.flex_time||b-a>=8))return false}else{const[lo,hi]=TOD[S.tod];if(!(a<hi&&b>lo))return false}}
    if(q&&!(e.title+e.description+(e.venue||"")+(e.district||"")+e.city).toLowerCase().includes(q))return false;
    if(S.when==="today"&&!ds.some(x=>x[1]===0))return false;
    if(S.when==="weekend"&&!ds.some(x=>[0,6].includes(x[0].getDay())&&x[1]>=0&&x[1]<=6))return false;
    if(S.when==="7d"&&!ds.some(x=>x[1]>=0&&x[1]<=7))return false;
    if(S.when==="month"&&!ds.some(x=>x[0].getMonth()===now.getMonth()&&x[0].getFullYear()===now.getFullYear()))return false;
    return true;
  }).sort((a,b)=>new Date(a.start_at)-new Date(b.start_at));
}
function cal(base){
  const y=S.month.getFullYear(),m=S.month.getMonth(),first=new Date(y,m,1).getDay(),n=new Date(y,m+1,0).getDate(),cnt={},today=ymd(new Date());
  base.forEach(e=>daysOf(e).forEach(d=>{const k=ymd(d);cnt[k]=(cnt[k]||0)+1}));
  let h=`<div class="cal-h"><button data-a="pm" aria-label="上個月">‹</button><b>${y} 年 ${m+1} 月</b><button data-a="nm" aria-label="下個月">›</button></div><div class="cal">${[...WK].map(d=>`<div class="wd">${d}</div>`).join("")}`;
  for(let i=0;i<first;i++)h+="<div></div>";
  for(let d=1;d<=n;d++){const k=ymd(new Date(y,m,d)),c=cnt[k]||0;h+=`<button class="day${c?" has":""}${S.day===k?" sel":""}${k===today?" today":""}" ${c?`data-a="day" data-k="${k}"`:"disabled"}>${d}${c?`<i>${c} 個</i>`:""}</button>`}
  return h+"</div>";
}

  modal(`<h3 style="margin-top:0">${e?"編輯活動":"分享一個活動"}</h3>
  <div class="rule"><b>活動投稿規則</b><ul><li>僅分享活動資訊：不接受折扣促銷、團購、業配、抽獎集客等文字</li><li>請完整填寫日期時間、地點、適合年齡與費用（含材料費），費用須誠實標示</li><li>本站不代收報名與費用，請提供主辦方的報名或詳情連結${org?"（商家／機構必填）":""}</li><li>${org?"商家／機構請填寫完整地址":"個人舉辦的活動只公開到縣市與區，請勿填住家地址，並盡量使用公共場地"}</li><li>活動說明 800 字內，照片 1 張（8 MB 內，會自動壓縮），請遵守隱私及著作權</li><li>活動結束後會自動從日曆隱藏；送出後需經審核才會公開，編輯後也會重新審核</li></ul></div>
  <label>活動名稱（40 字內）<input id="ft" maxlength="40" value="${esc(e?.title)}"></label>
  <div class="r"><label>開始日期<input id="fd" type="date" value="${st?ymd(st):""}"></label><label>結束日期（選填）<input id="fd2" type="date" value="${en&&ymd(en)!==ymd(st)?ymd(en):""}"></label></div>
  <p class="mu" style="margin:-4px 0 10px">連續多天的活動請填結束日期，日曆每天都會顯示。</p>
  <label class="mu" style="display:block;margin:0 0 10px"><input type="checkbox" id="fx" style="width:auto;margin:0 6px 0 0" ${e&&e.flex_time?"checked":""} onchange="document.getElementById('tprow').style.display=this.checked?'none':''">無特定時間／可自行預約</label>
  <div class="r" id="tprow" style="${e&&e.flex_time?"display:none":""}"><label>開始時間（24 小時制）${tp("fs1",e&&e.flex_time?null:st)}</label><label>結束時間（選填）${tp("fe1",e&&e.flex_time?null:en)}</label></div>
  <datalist id="mins"><option value="00"><option value="15"><option value="30"><option value="45"></datalist>
  <div class="r"><label>縣市<select id="fc">${CITIES.map(c=>`<option ${e?.city===c?"selected":""}>${c}</option>`).join("")}</select></label><label>區／鄉鎮<input id="fz" maxlength="10" value="${esc(e?.district)}"></label></div>
  <label>活動地點<input id="fv" maxlength="60" placeholder="例如：場館或店家名稱" value="${esc(e?.venue)}"></label>
  ${org?`<label>完整地址<input id="fad" maxlength="100" value="${esc(e?.address)}"></label>`:""}
  <label>地圖連結（選填，例如 Google 地圖的分享連結）<input id="fmp" type="url" maxlength="300" placeholder="https://" value="${esc(e?.map_link)}"></label>
  <div class="r"><label>建議年齡（起）<select id="fa1">${ages(e?e.age_min:0)}</select></label><label>建議年齡（迄）<select id="fa2">${ages(e?e.age_max:12)}</select></label></div>
  <label>參與對象<select id="fau"><option value="family" ${!e||e.audience==="family"?"selected":""}>親子（家長與孩子一起）</option><option value="kids" ${e&&e.audience==="kids"?"selected":""}>只有孩子（家長不需陪同）</option><option value="parents" ${e&&e.audience==="parents"?"selected":""}>只有家長（例如講座）</option></select></label>
  <div class="r"><label>費用（元，免費填 0）<input id="ff" type="number" min="0" max="100000" value="${e?e.fee:0}"></label><label>費用說明（選填，例如：含材料費）<input id="fn" maxlength="60" value="${esc(e?.fee_note)}"></label></div>
  <label>活動說明<textarea id="fh" rows="6" maxlength="800">${esc(e?.description)}</textarea></label>
  <label>${org?"報名或詳情連結（必填）":"報名或詳情連結（選填）"}<input id="fl" type="url" maxlength="200" placeholder="https://" value="${esc(e?.link)}"></label>
  <label>活動照片（選填，1 張${e?"；不選就保留原圖":""}）<input id="fp" type="file" accept="image/*"></label>
  <div class="r"><button class="p" id="fsub">${e?"儲存並重新送審":"送出審核"}</button><button data-a="shut">取消</button></div><div class="mu" id="fe"></div>`);
  $("#fsub").onclick=()=>submit(e);
}
async function shrink(f){
  const bm=await createImageBitmap(f),k=Math.min(1,900/Math.max(bm.width,bm.height)),c=document.createElement("canvas");
  c.width=Math.round(bm.width*k);c.height=Math.round(bm.height*k);c.getContext("2d").drawImage(bm,0,0,c.width,c.height);
  return new Promise(r=>c.toBlob(r,"image/webp",.8));
}
function tv(id){const h=$("#"+id+"h").value;if(!h)return"";let m=$("#"+id+"m").value.trim();if(m==="")m="00";if(!/^\d{1,2}$/.test(m)||+m>59)return null;return h+":"+m.padStart(2,"0")}
async function submit(e){
  const er=$("#fe"),org=S.me?.account_type==="organization",v=i=>$("#"+i)?$("#"+i).value.trim():"";
  const fx=$("#fx").checked,t=v("ft"),h=v("fh"),d=v("fd"),s1=fx?"00:00":tv("fs1"),e1=fx?"":tv("fe1"),lk=v("fl"),mp=v("fmp"),f=+v("ff"),a1=+v("fa1"),a2=+v("fa2"),file=$("#fp").files[0];
  if(s1===null||e1===null)return er.textContent="分鐘請輸入 00 到 59。";
  if(!t||!h||!d||!s1)return er.textContent="請填寫名稱、日期、開始時間與活動說明。";
  const d2=v("fd2"),st=new Date(d+"T"+s1),en=d2?new Date(d2+"T"+(e1||"23:59")):e1?new Date(d+"T"+e1):null;
  if(isNaN(st))return er.textContent="日期或時間格式不正確。";
  if(!e&&(fx?d<ymd(new Date()):st<new Date()))return er.textContent="活動時間需在現在之後。";
  if(en&&en<=st)return er.textContent="結束日期與時間需晚於開始。";
  if(en&&(en-st)/864e5>31)return er.textContent="活動最長 31 天。";
  if(a2<a1)return er.textContent="適合年齡的範圍有誤。";
  if(!(f>=0&&f<=100000))return er.textContent="費用需在 0 到 100000 之間。";
  if(lk&&!/^https?:\/\/[^\s]+$/i.test(lk))return er.textContent="連結需以 http:// 或 https:// 開頭。";
  if(mp&&!/^https?:\/\/[^\s]+$/i.test(mp))return er.textContent="地圖連結需以 http:// 或 https:// 開頭。";
  if(org&&!lk)return er.textContent="商家／機構需提供報名或詳情連結。";
  if(file&&file.size>8*1024*1024)return er.textContent="照片超過 8 MB。";
  $("#fsub").disabled=true;er.textContent="送出中…";
  try{
    let photo=e?e.photo:null;
    if(file){const p=S.u.id+"/"+crypto.randomUUID()+".webp";const{error}=await sb.storage.from("photos").upload(p,await shrink(file),{contentType:"image/webp"});if(error)throw error;if(e&&e.photo)await sb.storage.from("photos").remove([e.photo]);photo=p}
    const row={title:t,description:h,start_at:st.toISOString(),end_at:en?en.toISOString():null,city:$("#fc").value,district:v("fz")||null,venue:v("fv")||null,address:org?(v("fad")||null):null,age_min:a1,age_max:a2,fee:f,fee_note:v("fn")||null,link:lk||null,map_link:mp||null,audience:$("#fau").value,flex_time:fx,photo,status:"pending",reject_reason:null};
    const{error}=e?await sb.from("events").update(row).eq("id",e.id):await sb.from("events").insert({...row,author_id:S.u.id});
    if(error)throw error;await load();shut();alert("已送出，審核通過後就會公開。");location.hash="#/me";route();
  }catch(x){er.textContent="送出失敗："+(x.message||x);$("#fsub").disabled=false}
}
async function route(){
  const[,k,id]=(location.hash||"#/").split("/");
  if(k==="e")detail(id);else if(k==="me")me();else if(k==="admin")await admin();else if(k==="share"){home();history.replaceState(null,"","#/");act.new()}else home();
  window.scrollTo(0,0);
}
async function setUser(sess){
  S.u=sess?.user||null;S.me=null;
  if(S.u){const{data}=await sb.from("profiles").select("*").eq("id",S.u.id).maybeSingle();S.me=data}
  nav();await load();route();
}
window.addEventListener("hashchange",route);
sb.auth.onAuthStateChange((ev,sess)=>{if(ev==="PASSWORD_RECOVERY")setTimeout(pwBox,0);if(ev==="INITIAL_SESSION"||ev==="SIGNED_IN"||ev==="SIGNED_OUT")setTimeout(()=>setUser(sess),0)});

</script></body></html>
