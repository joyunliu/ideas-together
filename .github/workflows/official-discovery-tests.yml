name: Official event discovery tests
on:
  pull_request:
    paths:
      - 'admin/official-discovery.js'
      - 'tests/official-discovery.test.mjs'
      - 'tests/official-admin-drafts.test.mjs'
      - 'admin/ai-import.html'
      - '.github/workflows/official-discovery-tests.yml'
  push:
    branches: [main]
    paths:
      - 'admin/official-discovery.js'
      - 'tests/official-discovery.test.mjs'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/official-discovery.test.mjs tests/official-admin-drafts.test.mjs
